name: TMS_2.0 CI 

on:
  push:
    branches:
      - diaties

  pull_request:
    branches:
      - main

# Allow the workflow to merge changes into main.
permissions:
  contents: write

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: 3306
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check environment
        run: |
          echo "DB_HOST configured: ${{ secrets.DB_HOST != '' }}"
          echo "DB_NAME configured: ${{ secrets.DB_NAME != '' }}"
          echo "DB_USERNAME configured: ${{ secrets.DB_USERNAME != '' }}"
          echo "DB_PASSWORD configured: ${{ secrets.DB_PASSWORD != '' }}"
          echo "JWT_SECRET configured: ${{ secrets.JWT_SECRET != '' }}"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker files
        run: |
          echo "Repository files:"
          ls -la
          echo "Docker files:"
          find . -maxdepth 3 -type f \
            \( -name "docker-compose.yml" \
            -o -name "compose.yml" \
            -o -name "Dockerfile" \)

      - name: Verify Docker Compose
        run: test -f docker-compose.yml

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

  merge-to-main:
    name: Merge diaties into main
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - docker

    # Only merge after successful CI on a push to diaties.
    # Pull-request runs only validate the code.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diaties' &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.docker.result == 'success'

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge diaties into main
        run: |
          set -e

          git fetch origin main diaties

          git checkout -B main origin/main

          git merge --no-ff origin/diaties \
            -m "Merge diaties into main after successful CI"

          git push origin main

